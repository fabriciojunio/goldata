name: GolData CI

on:
  push:
    branches: [main, develop, "melhorias/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos e seguranca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
          pip install bandit pip-audit
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (tipos)
        run: mypy goldata
        continue-on-error: true
      - name: Bandit (seguranca do codigo)
        run: bandit -r goldata -q -x tests
      - name: pip-audit (vulnerabilidades de dependencias)
        run: pip-audit --progress-spinner off --skip-editable

  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Pytest com cobertura
        run: pytest
